<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040816">
        <animate attributeName="stop-color" values="#040816;#081229;#0b1026;#040816" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#151a45">
        <animate attributeName="stop-color" values="#151a45;#1a1450;#11263e;#151a45" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="aurora">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>

    <linearGradient id="title" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="sweep">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <ellipse cx="260" cy="120" rx="220" ry="110" fill="url(#aurora)" filter="url(#blur)">
    <animate attributeName="cx" values="200;350;200" dur="14s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="930" cy="220" rx="240" ry="120" fill="#7c3aed" opacity="0.18" filter="url(#blur)">
    <animate attributeName="cx" values="950;760;950" dur="16s" repeatCount="indefinite"/>
  </ellipse>

